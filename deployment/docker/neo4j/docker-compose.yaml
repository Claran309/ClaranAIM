networks:
  claran-graph:
    driver: bridge

services:
  neo4j:
    image: neo4j:2026.05.0
    container_name: claran-neo4j
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt driver
    environment:
      - NEO4J_AUTH=neo4j/claran_neo4j_123
      - NEO4J_PLUGINS=["apoc","graph-data-science"]

      # 基础内存，按服务器配置调整
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G

      # APOC 常用配置
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*

      # 日志
      - NEO4J_server_logs_debug_enabled=false
    volumes:
      - claran-neo4j-data:/data
      - claran-neo4j-logs:/logs
      - claran-neo4j-import:/import
      - claran-neo4j-plugins:/plugins
    networks:
      - claran-graph
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p claran_neo4j_123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  claran-neo4j-data:
  claran-neo4j-logs:
  claran-neo4j-import:
  claran-neo4j-plugins: