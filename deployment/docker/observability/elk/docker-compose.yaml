networks:
  claran-elk:
    driver: bridge

services:
  elasticsearch:
    image: elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - bootstrap.memory_lock=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - claran-elasticsearch-data:/usr/share/elasticsearch/data
      - ../config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    ports:
      - "9200:9200"
    networks:
      - claran-elk
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cat/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  kibana:
    image: kibana:8.11.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=claran_observability_dev_key_32_chars
      - XPACK_REPORTING_ENCRYPTIONKEY=claran_observability_report_key_32
    volumes:
      - ../config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "5601:5601"
    networks:
      - claran-elk
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  logstash:
    image: logstash:8.11.0
    environment:
      - LS_JAVA_OPTS=-Xmx256m -Xms128m
      - XPACK_MONITORING_ENABLED=false
    volumes:
      - ../config/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
    networks:
      - claran-elk
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    command: logstash -f /usr/share/logstash/pipeline/logstash.conf

  filebeat:
    image: elastic/filebeat:8.11.0
    user: root
    volumes:
      - ../../../../logs:/var/log/claran:ro
      - ../config/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - claran-filebeat-data:/usr/share/filebeat/data
    networks:
      - claran-elk
    depends_on:
      - logstash
    restart: unless-stopped
    command: filebeat -e -strict.perms=false

volumes:
  claran-elasticsearch-data:
  claran-filebeat-data:
