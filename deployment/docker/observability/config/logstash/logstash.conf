input {
  beats {
    port => 5044
  }
}

filter {
  grok {
    match => {
      "message" => [
        "^\[%{DATA:service_name}\]\s+%{TIMESTAMP_ISO8601:claran_time}\s+%{WORD:level}\s+%{DATA:caller}\s+%{GREEDYDATA:log_message}$",
        "^\[%{DATA:service_name}\]\s+%{GREEDYDATA:log_message}$"
      ]
    }
    tag_on_failure => ["claran_grok_failed"]
  }

  if ![service_name] and [log][file][path] {
    grok {
      match => { "[log][file][path]" => "/var/log/claran/%{DATA:service_name}/.*" }
      tag_on_failure => []
    }
  }

  if [service_name] {
    mutate {
      add_field => { "[service][name]" => "%{service_name}" }
    }
  }

  if [level] {
    mutate {
      lowercase => ["level"]
    }
  }

  if [claran_time] {
    date {
      match => ["claran_time", "yyyy-MM-dd HH:mm:ss.SSS"]
      target => "@timestamp"
      timezone => "Asia/Shanghai"
    }
  }

  if [trace_id] {
    mutate {
      add_field => { "[trace][id]" => "%{trace_id}" }
    }
  }

  if [span_id] {
    mutate {
      add_field => { "[span][id]" => "%{span_id}" }
    }
  }

  mutate {
    remove_field => ["service_name", "claran_time"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "claran-services-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
