x-claran-env: &claran-env
  MYSQL_HOST: mysql
  MYSQL_PORT: "33060"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  ETCD_ENDPOINTS: http://etcd:2379
  MINIO_ENDPOINT: minio:9000
  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: kafka:9092
  DTM_ENABLED: "true"
  DTM_SERVER: http://dtm:36789
  DTM_GROUP_SERVICE_URL: http://group-service:9102
  DTM_MSG_CORE_SERVICE_URL: http://msg-core-service:9103
  DTM_GROUP_BRANCH_ADDRESS: 0.0.0.0:9102
  DTM_MSG_CORE_BRANCH_ADDRESS: 0.0.0.0:9103
  MILVUS_ENABLED: "true"
  MILVUS_ADDRESS: milvus-standalone:19530
  MEMORY_RAG_MILVUS_ENABLED: "true"
  MEMORY_RAG_MILVUS_ADDRESS: milvus-standalone:19530
  NEO4J_ENABLED: "true"
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-claran_neo4j_123}
  OBSERVABILITY_ENABLED: "true"
  OBSERVABILITY_OTLP_ENDPOINT: http://otel-collector:4318
  OBSERVABILITY_GRAFANA_URL: http://localhost:8086
  OBSERVABILITY_JAEGER_URL: http://localhost:8085
  OBSERVABILITY_PROMETHEUS_URL: http://localhost:8084
  AGENT_SESSION_DIR: /app/storage/agent/runtimeFile
  AGENT_ROOT: /app/storage/agent/files
  SKILLS_DIR: /app/storage/agent/skills
  CLARAN_LOG_DIR: /app/logs

x-claran-common: &claran-common
  env_file:
    - ../../.env
  environment:
    <<: *claran-env
  restart: unless-stopped
  depends_on:
    - mysql
    - redis
    - etcd
    - minio
    - kafka
    - dtm
  networks:
    - claran-net

x-claran-build: &claran-build
  context: ../..
  dockerfile: deployment/docker/Dockerfile.service

services:
  mysql:
    image: mysql/mysql-server:latest
    container_name: claran-mysql
    restart: unless-stopped
    ports:
      - "3306:33060"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-chr070309}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ClaranCloudDisk}
      MYSQL_USER: ${MYSQL_USER:-claran}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chr070309}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --port=33060
    volumes:
      - claran_mysql_data:/var/lib/mysql
    networks:
      - claran-net

  redis:
    image: redis:latest
    container_name: claran-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - claran_redis_data:/data
    networks:
      - claran-net

  etcd:
    image: bitnami/etcd:3.5
    container_name: claran-etcd
    restart: unless-stopped
    ports:
      - "2379:2379"
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
    volumes:
      - claran_etcd_data:/bitnami/etcd
    networks:
      - claran-net

  minio:
    image: minio/minio:latest
    container_name: claran-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - claran_minio_data:/data
    networks:
      - claran-net

  kafka:
    image: bitnamilegacy/kafka:3.3.2-debian-11-r11
    container_name: claran-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_BROKER_ID: "1"
      KAFKA_CFG_NODE_ID: "1"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - claran_kafka_data:/bitnami/kafka
    networks:
      - claran-net

  dtm:
    image: yedf/dtm:latest
    container_name: claran-dtm
    restart: unless-stopped
    ports:
      - "36789:36789"
      - "36790:36790"
    environment:
      STORE_DRIVER: redis
      STORE_HOST: redis
      STORE_PORT: 6379
    depends_on:
      - redis
    networks:
      - claran-net

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    command: >
      etcd
      -advertise-client-urls=http://milvus-etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - claran_milvus_etcd_data:/etcd
    networks:
      - claran-net

  milvus-minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    restart: unless-stopped
    command: server /minio_data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - claran_milvus_minio_data:/minio_data
    networks:
      - claran-net

  milvus-standalone:
    image: milvusdb/milvus:v2.6.17
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_REGION: us-east-1
    ports:
      - "19530:19530"
    volumes:
      - claran_milvus_data:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio
    networks:
      - claran-net

  neo4j:
    image: neo4j:2026.05.0
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-claran_neo4j_123}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
    volumes:
      - claran_neo4j_data:/data
      - claran_neo4j_logs:/logs
      - claran_neo4j_import:/import
      - claran_neo4j_plugins:/plugins
    networks:
      - claran-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/config/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "8082:4318"
    networks:
      - claran-net

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/config/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "8084:9090"
    networks:
      - claran-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "8085:16686"
    networks:
      - claran-net

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "8086:3000"
    volumes:
      - claran_grafana_data:/var/lib/grafana
      - ./observability/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - claran-net

  user-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: user-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: user-service:9101

  group-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: group-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: group-service:9002

  msg-core-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: msg-core-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: msg-core-service:9003
    ports:
      - "9103:9103"

  msg-history-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: msg-history-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: msg-history-service:9004

  file-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: file-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: file-service:9005

  memory-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: memory-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: memory-service:9008

  settings-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: settings-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: settings-service:9009

  web-search-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: web-search-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: web-search-service:9114

  rag-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: rag-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: rag-service:9112

  knowledge-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: knowledge-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: knowledge-service:9113

  conversation-intelligence-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: conversation-intelligence-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: conversation-intelligence-service:9015

  mcp-gateway-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: mcp-gateway-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: mcp-gateway-service:9016

  admin-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: admin-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: admin-service:9017

  agent-runtime-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: agent-runtime-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: agent-runtime-service:9007
    volumes:
      - claran_agent_storage:/app/storage/agent

  agent-manager-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: agent-manager-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: agent-manager-service:9006
    volumes:
      - claran_agent_storage:/app/storage/agent

  api-gateway:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: api-gateway
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: 0.0.0.0:18080
    ports:
      - "18080:18080"
    volumes:
      - claran_source_storage:/app/storage/source

  websocket-gateway:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: websocket-gateway
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: 0.0.0.0:8081
    ports:
      - "8081:8081"

volumes:
  claran_mysql_data:
  claran_redis_data:
  claran_etcd_data:
  claran_minio_data:
  claran_kafka_data:
  claran_milvus_etcd_data:
  claran_milvus_minio_data:
  claran_milvus_data:
  claran_neo4j_data:
  claran_neo4j_logs:
  claran_neo4j_import:
  claran_neo4j_plugins:
  claran_grafana_data:
  claran_agent_storage:
  claran_source_storage:

networks:
  claran-net:
    driver: bridge
