services:
  mysql:
    image: mysql/mysql-server:latest
    container_name: MySQL
    restart: always
    ports:
      - "3306:33060"
    environment:
      MYSQL_ROOT_PASSWORD: chr070309
      MYSQL_DATABASE: ClaranCloudDisk
      MYSQL_USER: claran
      MYSQL_PASSWORD: chr070309
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --port=33060
    networks:
      - claran-net

  redis:
    image: redis:latest
    container_name: Redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - claran-net

  etcd:
    image: bitnami/etcd:3.5
    container_name: Etcd
    restart: always
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://localhost:2379
    volumes:
      - etcd_data:/bitnami/etcd
    networks:
      - claran-net

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9009:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - claran-net

  kafka:
    image: bitnamilegacy/kafka:3.3.2-debian-11-r11
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://127.0.0.1:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_BROKER_ID: "1"
      KAFKA_CFG_NODE_ID: "1"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - claran-net

  dtm:
    image: yedf/dtm:latest
    container_name: dtm-server
    restart: always
    ports:
      - "36789:36789"
      - "36790:36790"
    environment:
      STORE_DRIVER: redis
      STORE_HOST: redis
      STORE_PORT: 6379
    depends_on:
      - redis
    networks:
      - claran-net

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  kafka_data:

networks:
  claran-net:
    driver: bridge
