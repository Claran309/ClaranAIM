service:
  name: "conversation-intelligence-service"
  address: "127.0.0.1:9015"

mysql:
  dsn: ""

conversation_intelligence:
  window_message_limit: 100
  min_valuable_messages: 3
  schedule_interval_seconds: 60
  window_minutes: 60
  max_retries: 3
  retry_delay_seconds: 60
  llm_enabled: false
  llm_base_url: ""
  llm_api_key: ""
  llm_model: "glm-4-flash"

governance:
  rpc:
    timeout_ms: 15000
    circuit_breaker: true
    max_connections: 500
    max_qps: 200
observability:
  enabled: true
  environment: "dev"
  otlp_endpoint: "http://127.0.0.1:8082"
  metrics_address: "127.0.0.1:19015"
  dashboard_base_url: "http://127.0.0.1:8086"
  grafana_url: "http://127.0.0.1:8086"
  jaeger_url: "http://127.0.0.1:8085"
  kibana_url: "http://127.0.0.1:5601"
  prometheus_url: "http://127.0.0.1:8084"

