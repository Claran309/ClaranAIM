# 服务配置
service:
  name: "websocket-gateway"
  address: "127.0.0.1:8081"

# 以下敏感配置从 .env 文件读取
mysql:
  dsn: ""

redis:
  addr: ""
  password: ""
  db: 0

jwt:
  secret_key: ""
  expiration: 0

etcd:
  endpoints: []

kafka:
  enabled: true
  brokers:
    - "127.0.0.1:9092"
  client_id: "websocket-gateway"
observability:
  enabled: true
  environment: "dev"
  otlp_endpoint: "http://127.0.0.1:8082"
  metrics_address: "127.0.0.1:19081"
  dashboard_base_url: "http://127.0.0.1:8086"
  grafana_url: "http://127.0.0.1:8086"
  jaeger_url: "http://127.0.0.1:8085"
  kibana_url: "http://127.0.0.1:5601"
  prometheus_url: "http://127.0.0.1:8084"

