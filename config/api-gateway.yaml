service:
  name: "api-gateway"
  address: "127.0.0.1:8080"

mysql:
  dsn: ""

redis:
  addr: ""
  password: ""
  db: 0

jwt:
  secret_key: ""
  expiration: 0
  access_expiration: 0
  refresh_expiration: 0

etcd:
  endpoints: []

minio:
  endpoint: ""
  access_key: ""
  secret_key: ""
  bucket: ""
  use_minio: true

storage:
  dir: "./storage/source"

dtm:
  enabled: true
  server: "http://localhost:36789"
  group_service_url: "http://127.0.0.1:9102"
  msg_core_service_url: "http://127.0.0.1:9103"
  group_branch_address: "127.0.0.1:9102"
  msg_core_branch_address: "127.0.0.1:9103"

governance:
  rate_limit:
    enabled: true
    burst: 120
    window_seconds: 60
  rpc:
    timeout_ms: 60000
    circuit_breaker: true
    max_connections: 1000
    max_qps: 1000
