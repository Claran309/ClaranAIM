# 服务配置
service:
  name: "msg-core-service"
  address: "127.0.0.1:9003"

# 以下敏感配置从 .env 文件读取
mysql:
  dsn: ""

redis:
  addr: ""
  password: ""
  db: 0

jwt:
  secret_key: ""
  expiration: 0

etcd:
  endpoints: []

kafka:
  enabled: true
  brokers:
    - "127.0.0.1:9092"
  client_id: "msg-core-service"

dtm:
  enabled: true
  server: "http://localhost:36789"
  group_service_url: "http://127.0.0.1:9102"
  msg_core_service_url: "http://127.0.0.1:9103"
  group_branch_address: "127.0.0.1:9102"
  msg_core_branch_address: "127.0.0.1:9103"

governance:
  rpc:
    timeout_ms: 5000
    circuit_breaker: true
    max_connections: 1000
    max_qps: 1000

internal:
  settings_service_url: "http://127.0.0.1:9009"
  msg_core_service_url: "http://127.0.0.1:9104"
