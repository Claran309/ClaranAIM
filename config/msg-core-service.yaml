# 服务配置
service:
  name: "msg-core-service"
  address: "127.0.0.1:9003"

# 以下敏感配置从 .env 文件读取
mysql:
  dsn: ""

redis:
  addr: ""
  password: ""
  db: 0

jwt:
  secret_key: ""
  expiration: 0

etcd:
  endpoints: []

kafka:
  enabled: true
  brokers:
    - "127.0.0.1:9092"
  client_id: "msg-core-service"

dtm:
  enabled: true
  server: "http://localhost:36789"
  group_service_url: "http://127.0.0.1:9102"
  msg_core_service_url: "http://127.0.0.1:9103"
  group_branch_address: "127.0.0.1:9102"
  msg_core_branch_address: "127.0.0.1:9103"

governance:
  rpc:
    timeout_ms: 5000
    circuit_breaker: true
    max_connections: 1000
    max_qps: 1000
observability:
  enabled: true
  environment: "dev"
  otlp_endpoint: "http://127.0.0.1:8082"
  metrics_address: "127.0.0.1:19003"
  dashboard_base_url: "http://127.0.0.1:8086"
  grafana_url: "http://127.0.0.1:8086"
  jaeger_url: "http://127.0.0.1:8085"
  kibana_url: "http://127.0.0.1:5601"
  prometheus_url: "http://127.0.0.1:8084"

