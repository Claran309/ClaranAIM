# 服务配置
service:
  name: "user-service"
  address: "127.0.0.1:9001"

# 以下敏感配置从 .env 文件读取
# MySQL/Redis/JWT/Etcd 配置由环境变量覆盖
mysql:
  dsn: ""

redis:
  addr: ""
  password: ""
  db: 0

jwt:
  secret_key: ""
  expiration: 0
  access_expiration: 0
  refresh_expiration: 0

etcd:
  endpoints: []

governance:
  rpc:
    timeout_ms: 5000
    circuit_breaker: true
    max_connections: 1000
    max_qps: 1000
