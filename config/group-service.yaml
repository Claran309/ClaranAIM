# 服务配置
service:
  name: "group-service"
  address: "127.0.0.1:9002"

# 以下敏感配置从 .env 文件读取
mysql:
  dsn: ""

redis:
  addr: ""
  password: ""
  db: 0

jwt:
  secret_key: ""
  expiration: 0

etcd:
  endpoints: []

kafka:
  enabled: true
  brokers:
    - "127.0.0.1:9092"
  client_id: "group-service"

governance:
  rpc:
    timeout_ms: 5000
    circuit_breaker: true
    max_connections: 1000
    max_qps: 1000
