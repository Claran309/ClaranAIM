service:
  name: "settings-service"
  address: "127.0.0.1:9009"

mysql:
  dsn: ""

llm:
  default_api_key: ""
  default_base_url: ""
  default_model: ""

settings:
  # API Key / MCP Secret 的应用层加密密钥只通过 SETTINGS_SECRET_KEY 注入。
  secret_key: ""

skills:
  dir: "storage/agent/skills"

governance:
  rpc:
    timeout_ms: 5000
    circuit_breaker: true
    max_connections: 1000
    max_qps: 1000
observability:
  enabled: true
  environment: "dev"
  otlp_endpoint: "http://127.0.0.1:8082"
  metrics_address: "127.0.0.1:19009"
  dashboard_base_url: "http://127.0.0.1:8086"
  grafana_url: "http://127.0.0.1:8086"
  jaeger_url: "http://127.0.0.1:8085"
  kibana_url: "http://127.0.0.1:5601"
  prometheus_url: "http://127.0.0.1:8084"

