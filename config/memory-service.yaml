service:
  name: "memory-service"
  address: "127.0.0.1:9008"

mysql:
  dsn: ""

memory_rag:
  enabled: true
  embedding_dim: 256
  embedding_provider: "glm"
  embedding_url: "https://open.bigmodel.cn/api/paas/v4/embeddings"
  embedding_api_key: ""
  embedding_model: "embedding-3"
  embedding_dimension: 0
  milvus_enabled: false
  milvus_address: "127.0.0.1:19530"
  milvus_collection: "claran_memory_facts"
  vector_candidate_k: 80
  min_score: 0.05
  vector_weight: 0.45
  importance_weight: 0.25
  recency_weight: 0.15
  scope_weight: 0.15
  llm_filter_enabled: false
  llm_filter_base_url: ""
  llm_filter_api_key: ""
  llm_filter_model: "glm-4-flash"

governance:
  rpc:
    timeout_ms: 5000
    circuit_breaker: true
    max_connections: 1000
    max_qps: 1000
observability:
  enabled: true
  environment: "dev"
  otlp_endpoint: "http://127.0.0.1:8082"
  metrics_address: "127.0.0.1:19008"
  dashboard_base_url: "http://127.0.0.1:8086"
  grafana_url: "http://127.0.0.1:8086"
  jaeger_url: "http://127.0.0.1:8085"
  kibana_url: "http://127.0.0.1:5601"
  prometheus_url: "http://127.0.0.1:8084"

