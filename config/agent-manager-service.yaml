service:
  name: "agent-manager-service"
  address: "127.0.0.1:9006"

mysql:
  dsn: ""

redis:
  addr: ""
  password: ""
  db: 0

jwt:
  secret_key: ""
  expiration: 0

etcd:
  endpoints: []

llm:
  default_api_key: ""
  default_base_url: ""
  default_model: ""

agent:
  session_dir: "storage/agent/managerRuntimeFile"
  agent_root: "storage/agent/files"
