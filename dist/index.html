<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClaranAIM - 即时通讯</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="auth-page" class="page active">
        <div class="auth-container">
            <div class="auth-logo">💬</div>
            <h1>ClaranAIM</h1>
            <p class="subtitle">即时通讯 + AI 深度融合</p>
            <div class="tab-switch">
                <button class="tab-btn active" onclick="switchAuthTab('login')">登录</button>
                <button class="tab-btn" onclick="switchAuthTab('register')">注册</button>
            </div>
            <div id="login-form" class="auth-form active">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="login-username" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="login-password" placeholder="请输入密码">
                </div>
                <button class="btn-primary" onclick="login()">登录</button>
            </div>
            <div id="register-form" class="auth-form">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="reg-username" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="reg-password" placeholder="请输入密码">
                </div>
                <div class="form-group">
                    <label>昵称</label>
                    <input type="text" id="reg-nickname" placeholder="请输入昵称（可选）">
                </div>
                <button class="btn-primary" onclick="register()">注册</button>
            </div>
        </div>
    </div>

    <div id="main-page" class="page">
        <div class="main-layout">
            <div class="sidebar">
                <div class="user-info" onclick="showUserProfile()">
                    <div class="avatar" id="user-avatar">U</div>
                    <div class="user-detail">
                        <span class="user-name" id="user-name">用户</span>
                        <span class="user-status online" id="user-status">● 在线</span>
                    </div>
                    <button class="btn-icon logout-btn" onclick="event.stopPropagation();logout()" title="退出登录">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </button>
                </div>
                <div class="sidebar-tabs">
                    <button class="sidebar-tab active" onclick="switchSidebar('conversations', this)">
                        会话<span class="unread-badge" id="conv-unread" style="display:none">0</span>
                    </button>
                    <button class="sidebar-tab" onclick="switchSidebar('friends', this)">好友</button>
                    <button class="sidebar-tab" onclick="switchSidebar('groups', this)">群组</button>
                    <button class="sidebar-tab" onclick="switchSidebar('bots', this)">AI</button>
                </div>
                <div id="conversations-panel" class="sidebar-panel active">
                    <div class="panel-header">
                        <span>会话列表</span>
                        <button class="btn-small" onclick="showCreateConversation()">+ 新会话</button>
                    </div>
                    <div id="conversation-list" class="list-container"></div>
                </div>
                <div id="friends-panel" class="sidebar-panel">
                    <div class="panel-header">
                        <span>好友列表</span>
                        <button class="btn-small" onclick="showAddFriend()">+ 添加</button>
                    </div>
                    <div id="friend-list" class="list-container"></div>
                </div>
                <div id="groups-panel" class="sidebar-panel">
                    <div class="panel-header">
                        <span>群组列表</span>
                        <button class="btn-small" onclick="showCreateGroup()">+ 创建</button>
                    </div>
                    <div id="group-list" class="list-container"></div>
                </div>
                <div id="bots-panel" class="sidebar-panel">
                    <div class="panel-header">
                        <span>AI 助手</span>
                        <button class="btn-small" onclick="showCreateBotForm()">+ 创建</button>
                    </div>
                    <div id="bot-list" class="list-container"></div>
                </div>
            </div>

            <div class="content">
                <div id="chat-area" class="chat-area" style="display:none;">
                    <div class="chat-header">
                        <div class="chat-header-left">
                            <span id="chat-title">会话</span>
                            <span id="chat-type-badge" class="chat-type-badge"></span>
                        </div>
                        <div class="chat-header-right">
                            <button class="btn-icon" onclick="showSearchMessages()" title="搜索消息">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            </button>
                            <div class="dropdown-wrapper">
                                <button class="btn-icon" onclick="toggleChatMenu()" title="更多操作">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                                </button>
                                <div id="chat-menu" class="dropdown-menu" style="display:none;">
                                    <div class="dropdown-item" onclick="showConversationInfo()">会话详情</div>
                                    <div id="menu-group-manage" class="dropdown-item" onclick="showGroupManageFromMenu()" style="display:none;">群管理</div>
                                    <div id="menu-group-members" class="dropdown-item" onclick="showGroupMembersFromMenu()" style="display:none;">群成员</div>
                                    <div class="dropdown-item" onclick="pinConversation()">置顶会话</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="group-announcement-bar" class="announcement-bar" style="display:none;">
                        <span class="announcement-icon">📢</span>
                        <span id="announcement-text" class="announcement-text"></span>
                        <button class="announcement-close" onclick="closeAnnouncement()">✕</button>
                    </div>
                    <div id="message-list" class="message-list"></div>
                    <div class="chat-input">
                        <button class="btn-icon" onclick="uploadAndSendFile()" title="发送文件/图片">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                        </button>
                        <input type="text" id="msg-input" placeholder="输入消息..." onkeydown="if(event.key==='Enter'){if(currentBotID)sendBotChatMsg();else sendMessage();}">
                        <button class="btn-send" onclick="sendMessage()">发送</button>
                    </div>
                </div>
                <div id="welcome-area" class="welcome-area">
                    <div class="welcome-icon">💬</div>
                    <h2>欢迎使用 ClaranAIM</h2>
                    <p>选择一个会话开始聊天，或创建新的会话</p>
                    <div class="welcome-tips">
                        <div class="tip-item">💡 点击左侧「好友」可以开始私聊</div>
                        <div class="tip-item">💡 点击「群组」可以进入群聊</div>
                        <div class="tip-item">💡 点击「+ 新会话」创建新的对话</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-overlay" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeModal()">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">操作</h3>
                <button class="btn-close" onclick="closeModal()">✕</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
