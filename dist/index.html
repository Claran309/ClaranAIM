<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClaranAIM - 即时通讯测试平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 登录/注册页面 -->
    <div id="auth-page" class="page active">
        <div class="auth-container">
            <h1>ClaranAIM</h1>
            <p class="subtitle">即时通讯 + AI 深度融合</p>
            <div class="tab-switch">
                <button class="tab-btn active" onclick="switchAuthTab('login')">登录</button>
                <button class="tab-btn" onclick="switchAuthTab('register')">注册</button>
            </div>
            <!-- 登录表单 -->
            <div id="login-form" class="auth-form active">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="login-username" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="login-password" placeholder="请输入密码">
                </div>
                <button class="btn-primary" onclick="login()">登录</button>
            </div>
            <!-- 注册表单 -->
            <div id="register-form" class="auth-form">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="reg-username" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="reg-password" placeholder="请输入密码">
                </div>
                <div class="form-group">
                    <label>昵称</label>
                    <input type="text" id="reg-nickname" placeholder="请输入昵称（可选）">
                </div>
                <button class="btn-primary" onclick="register()">注册</button>
            </div>
        </div>
    </div>

    <!-- 主页面 -->
    <div id="main-page" class="page">
        <div class="main-layout">
            <!-- 左侧边栏 -->
            <div class="sidebar">
                <div class="user-info">
                    <div class="avatar" id="user-avatar">U</div>
                    <div class="user-detail">
                        <span class="user-name" id="user-name">用户</span>
                        <span class="user-status" id="user-status">在线</span>
                    </div>
                    <button class="btn-icon" onclick="logout()" title="退出登录">⏻</button>
                </div>
                <div class="sidebar-tabs">
                    <button class="sidebar-tab active" onclick="switchSidebar('conversations')">会话</button>
                    <button class="sidebar-tab" onclick="switchSidebar('friends')">好友</button>
                    <button class="sidebar-tab" onclick="switchSidebar('groups')">群组</button>
                </div>
                <!-- 会话列表 -->
                <div id="conversations-panel" class="sidebar-panel active">
                    <div class="panel-header">
                        <span>会话列表</span>
                        <button class="btn-small" onclick="showCreateConversation()">+ 新会话</button>
                    </div>
                    <div id="conversation-list" class="list-container"></div>
                </div>
                <!-- 好友列表 -->
                <div id="friends-panel" class="sidebar-panel">
                    <div class="panel-header">
                        <span>好友列表</span>
                        <button class="btn-small" onclick="showAddFriend()">+ 添加</button>
                    </div>
                    <div id="friend-list" class="list-container"></div>
                </div>
                <!-- 群组列表 -->
                <div id="groups-panel" class="sidebar-panel">
                    <div class="panel-header">
                        <span>群组列表</span>
                        <button class="btn-small" onclick="showCreateGroup()">+ 创建</button>
                    </div>
                    <div id="group-list" class="list-container"></div>
                </div>
            </div>

            <!-- 右侧内容区 -->
            <div class="content">
                <!-- 聊天区域 -->
                <div id="chat-area" class="chat-area" style="display:none;">
                    <div class="chat-header">
                        <span id="chat-title">会话</span>
                        <button class="btn-small" onclick="showConversationInfo()">详情</button>
                    </div>
                    <div id="message-list" class="message-list"></div>
                    <div class="chat-input">
                        <input type="text" id="msg-input" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMessage()">
                        <button class="btn-primary" onclick="sendMessage()">发送</button>
                    </div>
                </div>
                <!-- 欢迎区域 -->
                <div id="welcome-area" class="welcome-area">
                    <h2>欢迎使用 ClaranAIM</h2>
                    <p>选择一个会话开始聊天，或创建新的会话</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 模态框 -->
    <div id="modal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">操作</h3>
                <button class="btn-close" onclick="closeModal()">✕</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <!-- Toast通知 -->
    <div id="toast-container" class="toast-container"></div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
