name: Smoke

on:
  push:
    branches: ["main", "master", "codex/**"]
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run smoke checks
        shell: pwsh
        run: ./scripts/e2e-smoke.ps1
