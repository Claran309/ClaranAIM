name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal pkg)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt，请先执行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test with race detector
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m

  integration-test:
    name: Integration tests (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: claran_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      kafka:
        image: bitnamilegacy/kafka:3.3.2-debian-11-r11
        env:
          KAFKA_ENABLE_KRAFT: "yes"
          KAFKA_CFG_PROCESS_ROLES: "broker,controller"
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
          KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://127.0.0.1:9092"
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          KAFKA_BROKER_ID: "1"
          KAFKA_CFG_NODE_ID: "1"
          ALLOW_PLAINTEXT_LISTENER: "yes"
        ports:
          - 9092:9092
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run MySQL integration tests
        env:
          CLARAN_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/claran_test?charset=utf8mb4&parseTime=True&loc=Local
          CLARAN_TEST_KAFKA_BROKERS: 127.0.0.1:9092
        run: |
          # 多个包共用 event_outbox 表，必须串行执行，否则会互相清表造成偶发失败。
          go test -p 1 -tags=integration ./internal/msg-core-service/service/... -v
          go test -p 1 -tags=integration ./internal/agent-runtime-service/store/... -v
          go test -p 1 -tags=integration ./internal/agent-runtime-service/service/... -v
          go test -p 1 -tags=integration ./internal/agent-manager-service/dao/... -v
          go test -p 1 -tags=integration ./internal/memory-service/service/... -v
          go test -p 1 -tags=integration ./internal/group-service/service/... -v
          go test -p 1 -tags=integration ./pkg/eventbus/... -v
          go test -p 1 -tags=integration ./pkg/outbox/... -v

  compose-config:
    name: Validate compose manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate infra compose file
        run: docker compose -f deployment/docker/docker-compose.infra.yaml config -q
