  TZ: Asia/Shanghai
  MYSQL_HOST: mysql
  MYSQL_PORT: "33060"
  MYSQL_USER: ${MYSQL_USER:-claran}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chr070309}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-ClaranAIM}
  MYSQL_DSN: ${MYSQL_USER:-claran}:${MYSQL_PASSWORD:-chr070309}@tcp(mysql:33060)/${MYSQL_DATABASE:-ClaranAIM}?charset=utf8mb4&parseTime=True&loc=Local
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  REDIS_DB: "0"
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-claran-aim-dev-secret-change-me}
  JWT_EXPIRATION: ${JWT_EXPIRATION:-168}
  JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-168}
  JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-720}
  BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-this-admin-password}
  BOOTSTRAP_ADMIN_NICKNAME: ${BOOTSTRAP_ADMIN_NICKNAME:-管理员}
  ETCD_ENDPOINTS: http://etcd:2379
  MINIO_ENDPOINT: minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-claran-aim}
  MINIO_USE_MINIO: "true"
  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: kafka:9092
  DTM_ENABLED: "true"
  DTM_SERVER: http://dtm:36789
  DTM_GROUP_SERVICE_URL: http://group-service:9102
  DTM_MSG_CORE_SERVICE_URL: http://msg-core-service:9103
  DTM_GROUP_BRANCH_ADDRESS: 0.0.0.0:9102
  DTM_MSG_CORE_BRANCH_ADDRESS: 0.0.0.0:9103
  MILVUS_ENABLED: ${MILVUS_ENABLED:-true}
  MILVUS_ADDRESS: milvus-standalone:19530
  MILVUS_COLLECTION: ${MILVUS_COLLECTION:-claran_rag_chunks}
  MEMORY_RAG_ENABLED: ${MEMORY_RAG_ENABLED:-true}
  MEMORY_RAG_MILVUS_ENABLED: ${MEMORY_RAG_MILVUS_ENABLED:-true}
  MEMORY_RAG_MILVUS_ADDRESS: milvus-standalone:19530
  MEMORY_RAG_MILVUS_COLLECTION: ${MEMORY_RAG_MILVUS_COLLECTION:-claran_memory_facts}
  MEMORY_RAG_EMBEDDING_PROVIDER: ${MEMORY_RAG_EMBEDDING_PROVIDER:-hash}
  RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-hash}
  RAG_DEFAULT_MODE: ${RAG_DEFAULT_MODE:-adaptive}
  RAG_ROUTER_PROVIDER: ${RAG_ROUTER_PROVIDER:-rule}
  RAG_ROUTER_BASE_URL: ${RAG_ROUTER_BASE_URL:-}
  RAG_ROUTER_API_KEY: ${RAG_ROUTER_API_KEY:-}
  RAG_ROUTER_MODEL: ${RAG_ROUTER_MODEL:-glm-4-flash}
  RAG_RERANK_PROVIDER: ${RAG_RERANK_PROVIDER:-}
  RAG_RERANK_URL: ${RAG_RERANK_URL:-}
  RAG_RERANK_API_KEY: ${RAG_RERANK_API_KEY:-}
  RAG_RERANK_MODEL: ${RAG_RERANK_MODEL:-rerank}
  LLM_DEFAULT_API_KEY: ${LLM_DEFAULT_API_KEY:-}
  LLM_DEFAULT_BASE_URL: ${LLM_DEFAULT_BASE_URL:-https://api.openai.com/v1}
  LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-gpt-4o-mini}
  SETTINGS_SECRET_KEY: ${SETTINGS_SECRET_KEY:-claran-aim-dev-settings-secret-change-me}
  WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
  WEB_SEARCH_MAX_FETCH: ${WEB_SEARCH_MAX_FETCH:-5}
  WEB_SEARCH_MAX_PASSAGES: ${WEB_SEARCH_MAX_PASSAGES:-3}
  WEB_SEARCH_MAX_CHARS_PER_PAGE: ${WEB_SEARCH_MAX_CHARS_PER_PAGE:-12000}
  WEB_SEARCH_TRUSTED_DOMAINS: ${WEB_SEARCH_TRUSTED_DOMAINS:-gov.cn,edu.cn,who.int,cdc.gov,nih.gov,developer.mozilla.org,docs.github.com,openai.com,cloudwego.io,go.dev,docs.docker.com,kubernetes.io}
  WEB_SEARCH_USER_AGENT: ${WEB_SEARCH_USER_AGENT:-ClaranAIM-WebSearch/1.0}
  WEB_SEARCH_TIMEOUT_MS: ${WEB_SEARCH_TIMEOUT_MS:-10000}
  CONVERSATION_INTELLIGENCE_WINDOW_MESSAGE_LIMIT: ${CONVERSATION_INTELLIGENCE_WINDOW_MESSAGE_LIMIT:-100}
  CONVERSATION_INTELLIGENCE_MIN_VALUABLE_MESSAGES: ${CONVERSATION_INTELLIGENCE_MIN_VALUABLE_MESSAGES:-3}
  CONVERSATION_INTELLIGENCE_SCHEDULE_INTERVAL_SECONDS: ${CONVERSATION_INTELLIGENCE_SCHEDULE_INTERVAL_SECONDS:-60}
  CONVERSATION_INTELLIGENCE_WINDOW_MINUTES: ${CONVERSATION_INTELLIGENCE_WINDOW_MINUTES:-60}
  CONVERSATION_INTELLIGENCE_MAX_RETRIES: ${CONVERSATION_INTELLIGENCE_MAX_RETRIES:-3}
  CONVERSATION_INTELLIGENCE_RETRY_DELAY_SECONDS: ${CONVERSATION_INTELLIGENCE_RETRY_DELAY_SECONDS:-60}
  CONVERSATION_INTELLIGENCE_LLM_ENABLED: ${CONVERSATION_INTELLIGENCE_LLM_ENABLED:-false}
  CONVERSATION_INTELLIGENCE_LLM_BASE_URL: ${CONVERSATION_INTELLIGENCE_LLM_BASE_URL:-}
  CONVERSATION_INTELLIGENCE_LLM_API_KEY: ${CONVERSATION_INTELLIGENCE_LLM_API_KEY:-}
  CONVERSATION_INTELLIGENCE_LLM_MODEL: ${CONVERSATION_INTELLIGENCE_LLM_MODEL:-glm-4-flash}
  DOCUMENT_OCR_PROVIDER: ${DOCUMENT_OCR_PROVIDER:-}
  DOCUMENT_OCR_URL: ${DOCUMENT_OCR_URL:-}
  DOCUMENT_OCR_API_KEY: ${DOCUMENT_OCR_API_KEY:-}
  DOCUMENT_OCR_MODEL: ${DOCUMENT_OCR_MODEL:-glm-ocr}
  NEO4J_ENABLED: ${NEO4J_ENABLED:-true}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-claran_neo4j_123}
  NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
  OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
  OBSERVABILITY_ENVIRONMENT: ${OBSERVABILITY_ENVIRONMENT:-dev}
  OBSERVABILITY_OTLP_ENDPOINT: http://otel-collector:4318
  OBSERVABILITY_GRAFANA_URL: http://localhost:8086
  OBSERVABILITY_JAEGER_URL: http://localhost:8085
  OBSERVABILITY_PROMETHEUS_URL: http://localhost:8084
  OBSERVABILITY_DASHBOARD_BASE_URL: http://localhost:8086
  AGENT_SESSION_DIR: /app/storage/agent/runtimeFile
  AGENT_ROOT: /app/storage/agent/files
  SKILLS_DIR: /app/storage/agent/skills
  COZELOOP_API_TOKEN: ${COZELOOP_API_TOKEN:-}
  COZELOOP_WORKSPACE_ID: ${COZELOOP_WORKSPACE_ID:-}
  CLARAN_LOG_DIR: /app/logs

x-claran-common: &claran-common
  restart: unless-stopped
  environment:
    <<: *claran-env
  depends_on:
    mysql:
      condition: service_started
    redis:
      condition: service_started
    etcd:
      condition: service_started
    minio:
      condition: service_started
    kafka:
      condition: service_started
    dtm:
      condition: service_started
  networks:
    - claran-net

x-claran-build: &claran-build
  context: .
  dockerfile: deployment/docker/Dockerfile.service

services:
  mysql:
    image: mysql/mysql-server:8.0
    container_name: claran-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --port=33060
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-chr070309}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ClaranAIM}
      MYSQL_USER: ${MYSQL_USER:-claran}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chr070309}
    ports:
      - "3306:33060"
    volumes:
      - claran_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 33060 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - claran-net

  redis:
    image: redis:7-alpine
    container_name: claran-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - claran_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - claran-net

  etcd:
    image: bitnami/etcd:3.5
    container_name: claran-etcd
    restart: unless-stopped
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - claran_etcd_data:/bitnami/etcd
    networks:
      - claran-net

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: claran-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - claran_minio_data:/data
    networks:
      - claran-net

  kafka:
    image: bitnamilegacy/kafka:3.3.2-debian-11-r11
    container_name: claran-kafka
    restart: unless-stopped
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_BROKER_ID: "1"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - claran_kafka_data:/bitnami/kafka
    networks:
      - claran-net

  dtm:
    image: yedf/dtm:latest
    container_name: claran-dtm
    restart: unless-stopped
    environment:
      STORE_DRIVER: redis
      STORE_HOST: redis
      STORE_PORT: 6379
    ports:
      - "36789:36789"
      - "36790:36790"
    depends_on:
      redis:
        condition: service_started
    networks:
      - claran-net

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: claran-milvus-etcd
    restart: unless-stopped
    command: >
      etcd
      -advertise-client-urls=http://milvus-etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - claran_milvus_etcd_data:/etcd
    networks:
      - claran-net

  milvus-minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: claran-milvus-minio
    restart: unless-stopped
    command: server /minio_data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - claran_milvus_minio_data:/minio_data
    networks:
      - claran-net

  milvus-standalone:
    image: milvusdb/milvus:v2.6.17
    container_name: claran-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_REGION: us-east-1
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - claran_milvus_data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_started
      milvus-minio:
        condition: service_started
    networks:
      - claran-net

  neo4j:
    image: neo4j:5.26-community
    container_name: claran-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-claran_neo4j_123}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,gds.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - claran_neo4j_data:/data
      - claran_neo4j_logs:/logs
      - claran_neo4j_import:/import
      - claran_neo4j_plugins:/plugins
    networks:
      - claran-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: claran-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deployment/docker/observability/config/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "8079:4317"
      - "8082:4318"
      - "8889:8889"
    networks:
      - claran-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: claran-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deployment/docker/observability/config/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "8084:9090"
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - claran-net

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: claran-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "8085:16686"
    networks:
      - claran-net

  grafana:
    image: grafana/grafana:11.5.2
    container_name: claran-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "8086:3000"
    volumes:
      - claran_grafana_data:/var/lib/grafana
      - ./deployment/docker/observability/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployment/docker/observability/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started
    networks:
      - claran-net

  user-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: user-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: 0.0.0.0:9101

  group-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: group-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: 0.0.0.0:9002
    ports:
      - "9102:9102"

  msg-core-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: msg-core-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: 0.0.0.0:9003
    ports:
      - "9103:9103"

  msg-history-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: msg-history-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: 0.0.0.0:9004

  file-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: file-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: 0.0.0.0:9005
    volumes:
      - claran_file_storage:/app/storage

  memory-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: memory-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: 0.0.0.0:9008

  settings-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: settings-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: 0.0.0.0:9009
    volumes:
      - claran_agent_storage:/app/storage/agent

  web-search-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: web-search-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: 0.0.0.0:9114

  rag-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: rag-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: 0.0.0.0:9112

  knowledge-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: knowledge-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: 0.0.0.0:9113

  conversation-intelligence-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: conversation-intelligence-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: 0.0.0.0:9015

  mcp-gateway-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: mcp-gateway-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: 0.0.0.0:9016

  admin-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: admin-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: 0.0.0.0:9017

  agent-runtime-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: agent-runtime-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: 0.0.0.0:9007
    volumes:
      - claran_agent_storage:/app/storage/agent

  agent-manager-service:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: agent-manager-service
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: 0.0.0.0:9006
    volumes:
      - claran_agent_storage:/app/storage/agent

  api-gateway:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: api-gateway
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: 0.0.0.0:18080
    ports:
      - "18080:18080"
    volumes:
      - claran_source_storage:/app/storage/source

  websocket-gateway:
    <<: *claran-common
    build:
      <<: *claran-build
      args:
        SERVICE: websocket-gateway
    environment:
      <<: *claran-env
      SERVICE_ADDRESS: 0.0.0.0:8081
    ports:
      - "8081:8081"

volumes:
  claran_mysql_data:
  claran_redis_data:
  claran_etcd_data:
  claran_minio_data:
  claran_kafka_data:
  claran_milvus_etcd_data:
  claran_milvus_minio_data:
  claran_milvus_data:
  claran_neo4j_data:
  claran_neo4j_logs:
  claran_neo4j_import:
  claran_neo4j_plugins:
  claran_grafana_data:
  claran_agent_storage:
  claran_file_storage:
  claran_source_storage:

networks:
  claran-net:
    driver: bridge
